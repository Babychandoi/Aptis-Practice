spring:
  application:
    name: aptis-backend

  datasource:
    # characterEncoding nhận tên charset của Java (UTF-8), không phải của MySQL
    # (utf8mb4) — driver sẽ báo "Unsupported character encoding" nếu ghi utf8mb4.
    # Server dùng utf8mb4 theo collation đã đặt ở database.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:aptis}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${MYSQL_USER:aptis}
    password: ${MYSQL_PASSWORD:aptis}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý, Hibernate chỉ validate
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/aptis}
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Bật auth khi có username. Mailpit không cần xác thực nên để trống
          # MAIL_USERNAME là tự tắt — cùng một cấu hình chạy được cả hai.
          auth: ${MAIL_SMTP_AUTH:false}
          # Gmail cổng 587 yêu cầu nâng cấp lên TLS sau khi kết nối
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}
          # Không để treo vô hạn khi SMTP không phản hồi: gửi mail chạy async
          # nhưng thread pool vẫn bị chiếm chỗ.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Hiện chi tiết cho người có quyền: DOWN mà không nói thành phần nào hỏng
      # thì phải mò rất lâu.
      show-details: when-authorized
  health:
    mail:
      # SMTP hỏng KHÔNG được làm cả hệ thống DOWN. Không gửi được thư thì học
      # viên vẫn làm bài, mua gói, xem điểm bình thường; để mặc định bật thì
      # sai App Password là container bị đánh dấu unhealthy và ngừng phục vụ.
      enabled: false

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger

logging:
  level:
    root: INFO
    vn.weconex.aptis: DEBUG

# ---------------------------------------------------------------------
# Cấu hình nghiệp vụ
# ---------------------------------------------------------------------
aptis:
  jwt:
    # Bắt buộc override ở môi trường thật. Base64, tối thiểu 256 bit.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
    issuer: aptis-backend
    access-token-ttl: PT15M
    refresh-token-ttl: P30D

  refresh-cookie:
    name: ${REFRESH_COOKIE_NAME:aptis_refresh}
    # Production phải đặt true. Local HTTP cần false để trình duyệt nhận cookie.
    secure: ${REFRESH_COOKIE_SECURE:true}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    domain: ${REFRESH_COOKIE_DOMAIN:}

  security:
    max-failed-login-attempts: 5
    lock-duration: PT15M
    email-verification-ttl: P1D
    password-reset-ttl: PT1H

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    # Endpoint client dùng để upload/tải trực tiếp; khác endpoint nội bộ khi
    # backend chạy trong docker network.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    presigned-url-ttl: PT10M
    buckets:
      public-bucket: aptis-public
      content: aptis-content
      user-recordings: aptis-user-recordings
      user-uploads: aptis-user-uploads
      imports: aptis-imports
      exports: aptis-exports

  practice:
    # Số bộ câu hỏi mặc định cho một lượt luyện theo Part
    default-part-practice-size: 10
    max-custom-practice-size: 50
    # Thời gian tránh lặp lại câu vừa làm (PHẦN IX §57)
    avoid-repeat-window: P3D
    attempt-expiry-grace: PT30M
    # Part mà mỗi bộ câu hỏi chỉ là MỘT câu, hệ thống tự gom nhiều bộ thành một
    # đề khi tạo lượt. Dùng cho các Part mà đề thật gồm nhiều câu độc lập nhau:
    # biên tập viên nhập từng câu rời cho nhanh thay vì gom sẵn theo đề.
    # Khoá là partId, giá trị là số câu của một đề.
    merge-item-parts:
      # Reading Part 1 — đoạn văn 5 chỗ trống, ngân hàng lưu từng câu rời
      "[16000000-0000-4000-8000-000000000011]": 5
      # Speaking Part 1 — 3 câu hỏi cá nhân, mỗi câu ghi âm 30 giây
      "[16000000-0000-4000-8000-000000000031]": 3
      # Writing Part 1 — 5 câu trả lời ngắn về bản thân
      "[16000000-0000-4000-8000-000000000041]": 5
      # Grammar — đề thật là 25 câu điền từ liên tiếp trong một lượt
      "[16000000-0000-4000-8000-000000000001]": 25
      # Listening Part 1 — 13 câu trắc nghiệm, mỗi câu một đoạn audio riêng
      "[16000000-0000-4000-8000-000000000021]": 13
      # Listening Part 4 — 2 bài giảng x 2 câu suy luận
      "[16000000-0000-4000-8000-000000000024]": 2
      # Speaking Part 4 — 3 câu về cùng một chủ đề trừu tượng
      "[16000000-0000-4000-8000-000000000034]": 3

  entitlement:
    premium-code: PREMIUM_CONTENT_ACCESS
    # Chính sách khi mua thêm lúc Premium chưa hết hạn (PHẦN IV §34):
    # EXTEND_CURRENT = cộng dồn vào subscription hiện tại
    # QUEUE_NEXT     = tạo subscription mới nối tiếp sau ends_at
    renewal-policy: EXTEND_CURRENT

  billing:
    # Hộp thư nhận báo khi học viên khai đã chuyển khoản, để đối soát sao kê.
    # Để trống thì không gửi, phải tự vào trang quản trị kiểm tra.
    transfer-notify-email: ${TRANSFER_NOTIFY_EMAIL:}

  outbox:
    poll-interval: PT5S
    batch-size: 100
    max-retry: 10

  export:
    # Báo cáo chứa dữ liệu học viên nên hết hạn là xóa hẳn file khỏi MinIO.
    # Rút ngắn khi chạy e2e để không phải chờ một tiếng.
    purge-interval: ${EXPORT_PURGE_INTERVAL:PT1H}
    purge-initial-delay: ${EXPORT_PURGE_INITIAL_DELAY:PT2M}
