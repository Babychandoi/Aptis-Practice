spring:
  jpa:
    show-sql: false

  flyway:
    connect-retries: 10
    connect-retries-interval: 5s

logging:
  level:
    vn.weconex.aptis: INFO

aptis:
  mail:
    from: ${MAIL_FROM:no-reply@aptis.local}

  payment:
    sandbox:
      enabled: true
      secret: sandbox-secret
      checkout-url: http://localhost/sandbox-checkout
      async-refund: ${SANDBOX_ASYNC_REFUND:false}

  evaluation:
    # Chấm bằng LLM qua API tương thích OpenAI (9Router). Bật lên thì
    # LlmEvaluationEngine (@Order 0) được chọn trước heuristic.
    llm:
      enabled: ${AI_EVAL_ENABLED:false}
      # Danh sach nha cung cap, moi dong: baseUrl|apiKey|model|maxConcurrent
      # Trong de tranh 429: DS2API chi nhan 10 request dong thoi (do duoc),
      # 9Router chiu duoc 50 van 100%. Bo trong thi dung base-url ben duoi.
      providers: ${AI_EVAL_PROVIDERS:}
      # So request dong thoi toi da khi chi cau hinh mot provider.
      max-concurrent: ${AI_EVAL_MAX_CONCURRENT:8}
      base-url: ${AI_EVAL_BASE_URL:}
      api-key: ${AI_EVAL_API_KEY:}
      model: ${AI_EVAL_MODEL:AI-PRO}
      # Thấp hơn chatbot: chấm điểm phải nhất quán giữa các lần, không sáng tạo.
      temperature: ${AI_EVAL_TEMPERATURE:0.2}
      max-tokens: ${AI_EVAL_MAX_TOKENS:16384}
      timeout-seconds: ${AI_EVAL_TIMEOUT:60}
    # Bản dự phòng: chỉ đếm từ và dò từ nối, không phải AI. Giữ để luồng chấm
    # vẫn chạy khi chưa cấu hình LLM.
    # Analyzer local xử lý audio trước. Khối stt bên dưới chỉ là fallback từ xa
    # có thể phát sinh phí và mặc định không được gọi.
    local-audio:
      enabled: ${LOCAL_SPEAKING_ENABLED:false}
      base-url: ${LOCAL_SPEAKING_URL:http://localhost:8000}
      timeout-seconds: ${LOCAL_SPEAKING_TIMEOUT:300}
      # false prevents an unexpected paid audio request when the local service is down.
      fallback-to-remote: ${LOCAL_SPEAKING_FALLBACK_REMOTE:false}
    stt:
      enabled: ${AI_STT_ENABLED:false}
      base-url: ${AI_STT_BASE_URL:${AI_EVAL_BASE_URL:}}
      api-key: ${AI_STT_API_KEY:${AI_EVAL_API_KEY:}}
      model: ${AI_STT_MODEL:ag/gemini-3-flash}
      timeout-seconds: ${AI_STT_TIMEOUT:120}
    heuristic:
      enabled: ${AI_EVAL_HEURISTIC_ENABLED:true}
