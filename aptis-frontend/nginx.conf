server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén text; ảnh và font đã nén sẵn nên bỏ qua
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Header bảo mật cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy API sang backend trong cùng docker network.
    # Nhờ đó frontend và API cùng origin — không cần CORS, không cần build lại
    # image khi đổi địa chỉ backend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backend đọc header này để ghi ip_address vào refresh_tokens
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload ghi âm Speaking đi trực tiếp lên MinIO, nhưng vẫn nới giới hạn
        # cho các request khác
        client_max_body_size 25m;
        proxy_read_timeout 60s;
    }

    # Asset có hash trong tên file nên cache được lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi route không phải file thật đều trả index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
