# Giữ nguyên giao thức mà TRÌNH DUYỆT đã dùng.
#
# Khi có proxy ngoài (Cloudflare Tunnel, load balancer), chặng proxy→nginx là
# HTTP nên $scheme luôn = "http". Chuyển thẳng $scheme xuống backend thì backend
# tưởng cả request là HTTP và sinh link email/redirect sai giao thức. Bản đồ này
# ưu tiên X-Forwarded-Proto do proxy ngoài đặt, chỉ rơi về $scheme khi không có.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # www -> non-www, 301.
    #
    # DNS trỏ cả hai tên miền về cùng server nhưng KHÔNG tạo chuyển hướng, và
    # server_name _ nhận mọi host, nên www từng trả 200 y như bản chính. Google
    # coi đó là hai site trùng nội dung: tín hiệu xếp hạng bị chia lẻ và có thể
    # lập chỉ mục bản www thay vì bản mình muốn.
    #
    # Dùng $forwarded_proto thay vì https cố định: sau Cloudflare Tunnel thì
    # chặng proxy→nginx là HTTP, ghi cứng sẽ sai khi chạy local.
    if ($host ~* ^www\.(.+)$) {
        return 301 $forwarded_proto://$1$request_uri;
    }

    # Nén text; ảnh và font đã nén sẵn nên bỏ qua
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Header bảo mật cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # mime.types của nginx không có .webmanifest nên nó rơi về
    # application/octet-stream, và Chrome bỏ qua manifest sai kiểu — mất icon
    # khi người dùng "Thêm vào màn hình chính".
    location = /site.webmanifest {
        types { } default_type application/manifest+json;
    }

    # Proxy API sang backend trong cùng docker network.
    # Nhờ đó frontend và API cùng origin — không cần CORS, không cần build lại
    # image khi đổi địa chỉ backend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backend đọc header này để ghi ip_address vào refresh_tokens
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Upload ghi âm Speaking đi trực tiếp lên MinIO, nhưng vẫn nới giới hạn
        # cho các request khác
        client_max_body_size 25m;
        proxy_read_timeout 60s;
    }

    # Proxy WebSocket sang backend
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Asset có hash trong tên file nên cache được lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Font self-host: tên file không có hash, nhưng nội dung một weight/subset
    # không bao giờ đổi — đổi font là đổi luôn tên file. Không đặt ở đây thì
    # nginx trả mặc định 4 giờ, khiến trình duyệt và Cloudflare tải lại font vô
    # ích nhiều lần mỗi ngày.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Font tải kèm crossorigin (xem thẻ preload trong index.html) nên cần
        # header này, nếu không trình duyệt bỏ file đã tải và lấy lại lần nữa.
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # SPA: mọi route không phải file thật đều trả index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
